spring:
  application:
    name: monitoramento-de-frota
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/frota
    username: frota
    password: change-me
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPGDialect
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  mqtt:
    habilitado: ${MQTT_HABILITADO:true}
    broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
    topico-posicoes: frota/+/posicao
    client-id-prefix: monitoramento-de-frota
  simulador:
    habilitado: ${SIMULADOR_HABILITADO:false}
    veiculos: ${SIMULADOR_VEICULOS:30}
    intervalo-ms: ${SIMULADOR_INTERVALO_MS:2000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
