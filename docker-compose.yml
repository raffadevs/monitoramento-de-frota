services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-frota}
      POSTGRES_USER: ${POSTGRES_USER:-frota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-frota}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "${MQTT_PORT:-1883}:1883"

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_DB: ${POSTGRES_DB:-frota}
      POSTGRES_USER: ${POSTGRES_USER:-frota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-8094}
      SIMULADOR_HABILITADO: ${SIMULADOR_HABILITADO:-true}
      SIMULADOR_VEICULOS: ${SIMULADOR_VEICULOS:-30}
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-8077}:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: "http://localhost:${BACKEND_PORT:-8077}"
        VITE_WS_URL: "ws://localhost:${BACKEND_PORT:-8077}/ws"
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8094}:80"

volumes:
  postgres_data:
